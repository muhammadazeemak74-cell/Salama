org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# AGP 9.1.0 warns that its maximum *recommended* compileSdk is 36, and the app
# compiles against 37 because flutter_secure_storage requires it. The
# combination builds; this silences the warning for that specific version so a
# real one is not lost in it. Remove it when AGP moves past 37.
android.suppressUnsupportedCompileSdk=37
